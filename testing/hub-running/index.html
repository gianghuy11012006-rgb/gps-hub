<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Toggle</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .gps-control{
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .gps-heading{
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
        }
        .gps-pill{
            display: inline-flex;
            background: #b8b8b8;
            border: none;
            border-radius: 999px;
            min-width: 75px;
            height: 35px;
            cursor: pointer;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            padding: 4px 16px 4px 4px;
            -webkit-tap-highlight-color: transparent;
            transition: 
                background-color .45 ease,
                box-shadow .45 ease;
        }
        .gps-knob{
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: rgb(226, 25, 25);
            flex-shrink: 0;
            transition: .5s ease;
            transform: translateX(0);
        }
        .gps-text{
            font-size: 15px;
            font-weight: 600;
            color: #111111;
            line-height: 1;
            transform: translateX(0);
            opacity: 1;
            transition:
                transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.22s ease,
                color 0.35s ease;
        }
        .gps-pill[aria-checked="true"] .gps-knob{
            background: #16ce1f;
            transform: translateX(42px);
            transition: .5s ease;
        }
        .gps-pill[aria-checked="true"] .gps-text{
            transform: translateX(-25px);
        }


    </style>
</head>
<body>
    <div class="gps-control">
        <span class="gps-heading">GPS</span>
        <button id="gps-toggle" class="gps-pill" type="button" role="switch" aria-checked="false" aria-label="GPS">
            <span class="gps-knob"></span>
            <span class="gps-text">Off</span>
        </button>
    </div>
    <script>
        const gpsToggle = document.getElementById("gps-toggle");
        const gpsText = gpsToggle.querySelector(".gps-text");

        gpsToggle.addEventListener("click", () => {
            const isOn = gpsToggle.getAttribute("aria-checked") === "true";
            const nextOn = !isOn;

            gpsToggle.setAttribute("aria-checked", String(nextOn));
            gpsText.textContent = nextOn ? "On" : "Off"
        });      
    </script>
</body>
</html>
